<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA05</title>
</head>

<body>
    <script>
        let soma = 0;

        for (let i = 1; i <= 200; i++) {
            if (i % 2 === 0) soma += i;
        }

        alert("A soma dos pares até 200 é: " + soma);

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA05</title>
</head>

<body>
    <script>
        let soma = 0;

        for (let i = 1; i <= 5; i++) {
            let num = Number(prompt("Digite o " + i + "º número:"));
            soma += num;
        }

        alert("A média é: " + (soma / 5));

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA05</title>
</head>

<body>
    <script>
        let maiores = 0;

        for (let i = 1; i <= 10; i++) {
            let idade = Number(prompt("Digite a idade " + i + ":"));
            if (idade >= 18) maiores++;
        }

        alert("Quantidade de maiores de idade: " + maiores);
        for (let i = 1; i <= 20; i++) {
            alert(i);
        }
    </script>
</body>

</html>

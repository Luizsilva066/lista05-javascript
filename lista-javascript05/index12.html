<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA05</title>
</head>

<body>
    <script>
        let n = Number(prompt("Digite um número:"));
        let f = 1;

        for (let i = n; i >= 1; i--) {
            f *= i;
        }

        alert("Fatorial de " + n + " = " + f);

    </script>
</body>

</html>

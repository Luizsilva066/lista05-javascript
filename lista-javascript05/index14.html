<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA05</title>
</head>

<body>
    <script>
        let nomes = [];

        for (let i = 1; i <= 5; i++) {
            nomes.push(prompt("Digite o " + i + "º nome:"));
        }

        nomes.reverse();

        alert("Nomes em ordem invertida:\n" + nomes.join("\n"));

    </script>
</body>

</html>

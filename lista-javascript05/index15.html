    <script>
        let n = Number(prompt("Digite o tamanho da base do triângulo:"));
        let desenho = "";

        for (let i = 1; i <= n; i++) {
            desenho += "*".repeat(i) + "\n";
        }

        alert(desenho);

    </script>
